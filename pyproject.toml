[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gliner2", "gliner2.*"]

[tool.setuptools.package-data]
gliner2 = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gliner2.__version__"}

[project]
name = "gliner2"
description = "GLiNER2: Unified Schema-Based Information Extraction and Text Classification"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

maintainers = [
    {name = "Urchade Zaratiana"},
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0,<3",
    "requests>=2.28,<3",
    "tqdm>=4.64,<5",
    "urllib3>=1.26,<3",
]

dynamic = ["version"]

[project.optional-dependencies]
local = [
    "numpy>=1.24,<3",
    "peft>=0.10,<1",
    "safetensors>=0.4,<1",
    "torch>=2.1,<3",
    "transformers>=4.43,<6",
]
disentangled-flash = [
    "disentangled-flash>=1.1,<2",
    "transformers>=4.57,<6",
]
train = [
    "numpy>=1.24,<3",
    "peft>=0.10,<1",
    "protobuf>=4,<8",
    "PyYAML>=6,<7",
    "safetensors>=0.4,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.1,<3",
    "transformers>=4.43,<6",
]
test = [
    "packaging>=24.2,<27",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "tomli>=2,<3; python_version < '3.11'",
]
dev = [
    "build>=1,<2",
    "mypy>=1.10,<3",
    "numpy>=1.24,<3",
    "packaging>=24.2,<27",
    "peft>=0.10,<1",
    "protobuf>=4,<8",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "PyYAML>=6,<7",
    "ruff>=0.6,<1",
    "safetensors>=0.4,<1",
    "scipy>=1.10,<2",
    "sentencepiece>=0.2,<1",
    "torch>=2.1,<3",
    "tomli>=2,<3; python_version < '3.11'",
    "transformers>=4.43,<6",
    "twine>=5,<8",
    "types-PyYAML>=6,<7",
    "types-requests>=2.28,<3",
]
benchmark = [
    "datasets>=3.0,<6",
    "numpy>=1.24,<3",
    "peft>=0.10,<1",
    "safetensors>=0.4,<1",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "torch>=2.1,<3",
    "transformers>=4.43,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packaging_tests"]
pythonpath = ["."]
markers = [
    "slow: end-to-end tests that load models or are otherwise slow",
    "quality: checkpoint-dependent inference quality expectations",
    "compile: torch.compile / export-path tests (platform dependent)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "gliner2/__init__.py",
    "gliner2/training/__init__.py",
    "packaging_tests/**/*.py",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = [
    "gliner2/__init__.py",
    "gliner2/training/__init__.py",
]
incremental = true
cache_dir = ".mypy_cache"
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["gliner2"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[project.urls]
Homepage = "https://github.com/fastino-ai/GLiNER2"
Repository = "https://github.com/fastino-ai/GLiNER2"
